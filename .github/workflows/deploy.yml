name: Publish lead dashboard

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "data/leads.json"
      - ".github/workflows/deploy.yml"
  workflow_run:
    workflows: ["Refresh Prague leads"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare public site (exclude scripts / manual pipeline)
        run: |
          mkdir -p public/data
          cp index.html styles.css app.js public/
          cp data/leads.json public/data/leads.json
          touch public/.nojekyll
      - name: Validate dashboard bundle
        run: |
          test -s public/index.html
          test -s public/app.js
          test -s public/styles.css
          python -m json.tool public/data/leads.json >/dev/null
          echo 'Validated dashboard files and lead JSON.'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show deployed dashboard URL
        run: echo 'Dashboard deployed to ${{ steps.deployment.outputs.page_url }}' >> "$GITHUB_STEP_SUMMARY"
