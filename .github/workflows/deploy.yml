name: Publish lead dashboard

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "picks.js"
      - "data/manual-leads.json"
      - "data/leads.json"
      - "data/research.json"
      - ".github/workflows/deploy.yml"
  workflow_run:
    workflows: ["Refresh Prague leads"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare public site (exclude scripts / manual pipeline)
        run: |
          mkdir -p public/data
          cp index.html styles.css app.js picks.js public/
          cp data/manual-leads.json public/data/manual-leads.json
          cp data/leads.json public/data/leads.json
          cp data/research.json public/data/research.json
          touch public/.nojekyll
      - name: Validate dashboard bundle
        run: |
          test -s public/index.html
          test -s public/app.js
          test -s public/picks.js
          test -s public/data/manual-leads.json
          test -s public/styles.css
          python -m json.tool public/data/leads.json >/dev/null
          python -m json.tool public/data/research.json >/dev/null
          python -m json.tool public/data/manual-leads.json >/dev/null
          node --check public/app.js
          node --check public/picks.js
          node --test tests/picks.test.cjs
          echo 'Validated dashboard files and lead JSON.'
      - name: Verify Pages is activated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(curl -sS -o /tmp/pages-check.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$STATUS" = "404" ]; then
            echo "::error::GitHub Pages needs one-time activation: Settings > Pages > Build and deployment > Source > GitHub Actions."
            echo "### Action required" >> "$GITHUB_STEP_SUMMARY"
            echo "Enable **Settings → Pages → Source → GitHub Actions**, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$STATUS" != "200" ]; then
            echo "::error::Unable to inspect GitHub Pages (HTTP $STATUS)."
            cat /tmp/pages-check.json
            exit 1
          fi
          echo "GitHub Pages is activated."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test the published dashboard
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          url = os.environ['SITE_URL'].rstrip('/') + '/'
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=18) as response:
                      page = response.read().decode('utf-8')
                  with urllib.request.urlopen(url + 'picks.js', timeout=18) as response:
                      pick_code = response.read().decode('utf-8')
                  assert 'FieldnotesPicks' in pick_code, 'Top-three policy script missing'
                  with urllib.request.urlopen(url + 'data/research.json', timeout=18) as response:
                      research = json.load(response)
                  assert 'reports' in research, 'Research reports missing'
                  with urllib.request.urlopen(url + 'data/leads.json', timeout=18) as response:
                      data = json.load(response)
                  assert 'fieldnotes' in page.lower(), 'Dashboard HTML signature missing'
                  assert isinstance(data['leads'], list), 'Lead JSON lacks leads array'
                  print('LIVE SITE VERIFIED:', url, 'LEADS:', len(data['leads']))
                  break
              except (urllib.error.URLError, AssertionError, KeyError, ValueError) as exc:
                  if attempt == 11:
                      raise SystemExit('Live URL could not be verified: ' + str(exc))
                  print('Waiting for Pages CDN:', attempt+1, str(exc))
                  time.sleep(10)
          PY
      - name: Show deployed dashboard URL
        run: echo 'Dashboard deployed to ${{ steps.deployment.outputs.page_url }}' >> "$GITHUB_STEP_SUMMARY"
