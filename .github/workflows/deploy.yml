name: Publish lead dashboard

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "data/leads.json"
      - ".github/workflows/deploy.yml"
  workflow_run:
    workflows: ["Refresh Prague leads"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare public site (exclude scripts / manual pipeline)
        run: |
          mkdir -p public/data
          cp index.html styles.css app.js public/
          cp data/leads.json public/data/leads.json
          touch public/.nojekyll
      - name: Validate dashboard bundle
        run: |
          test -s public/index.html
          test -s public/app.js
          test -s public/styles.css
          python -m json.tool public/data/leads.json >/dev/null
          node --check public/app.js
          echo 'Validated dashboard files and lead JSON.'
      - name: Verify Pages is activated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(curl -sS -o /tmp/pages-check.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$STATUS" = "404" ]; then
            echo "::error::GitHub Pages needs one-time activation: Settings > Pages > Build and deployment > Source > GitHub Actions."
            echo "### Action required" >> "$GITHUB_STEP_SUMMARY"
            echo "Enable **Settings → Pages → Source → GitHub Actions**, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$STATUS" != "200" ]; then
            echo "::error::Unable to inspect GitHub Pages (HTTP $STATUS)."
            cat /tmp/pages-check.json
            exit 1
          fi
          echo "GitHub Pages is activated."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show deployed dashboard URL
        run: echo 'Dashboard deployed to ${{ steps.deployment.outputs.page_url }}' >> "$GITHUB_STEP_SUMMARY"
