name: Refresh Prague leads

on:
  schedule:
    # Every day at 09:00 local Prague time (CET/CEST, DST-aware).
    - cron: "0 9 * * *"
      timezone: "Europe/Prague"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect.yml"
      - "data/manual-leads.json"
      - "requirements-research.txt"

permissions:
  contents: write

concurrency:
  group: prague-leads-refresh
  cancel-in-progress: false

jobs:
  collect:
    name: Discover, verify and research leads
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python research libraries
        run: python -m pip install -r requirements-research.txt
      - name: Test collector and research without network
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Download or reuse official Czech RES company snapshot
        id: res
        continue-on-error: true
        timeout-minutes: 30
        run: python scripts/res_ingest.py
      - name: Report registry source outcome
        if: steps.res.outcome == 'failure'
        run: |
          echo "::warning::ČSÚ RES unavailable; keeping last valid official candidate snapshot."
          echo "ČSÚ RES refresh unavailable; check registry download step." >> "$GITHUB_STEP_SUMMARY"
      - name: Discover Prague businesses
        run: python scripts/refresh.py
      - name: Install headless Chromium for responsive audit
        run: python -m playwright install --with-deps chromium
      - name: Research websites, registry signals and contact evidence
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          RESEARCH_DAILY_LIMIT: 12
        run: python scripts/research.py
      - name: Preserve screenshot audit evidence as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-website-audit-screenshots
          path: research-screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Calculate unified commercial qualification
        run: python scripts/qualify.py
      - name: Browser smoke existing CRM and new qualification dashboard
        run: python scripts/smoke_dashboard.py
      - name: Reconcile and publish generated data safely
        run: python scripts/safe_publish.py
