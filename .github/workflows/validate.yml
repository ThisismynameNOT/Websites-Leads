name: Validate lead dashboard changes

on:
  pull_request:
    paths:
      - "index.html"
      - "legacy-radar.html"
      - "sales.css"
      - "sales.js"
      - "data/october-review.json"
      - "styles.css"
      - "app.js"
      - "picks.js"
      - "opportunity.js"
      - "demos/majer-roofing/index.html"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install research test dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Static syntax checks
        run: |
          python -m compileall -q scripts tests
          node --check app.js
          node --check picks.js
          node --check opportunity.js
          node --check sales.js
          python -m json.tool data/october-review.json >/dev/null
      - name: Test company ingestion and qualification
        run: python -m unittest discover -s tests -v
      - name: Test featured shortlist
        run: node --test tests/*.test.cjs
      - name: Verify dashboard hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path("legacy-radar.html").read_text(encoding="utf-8")
          c=Path("styles.css").read_text(encoding="utf-8")
          assert 'id="source-status-list"' in h
          assert 'id="top-three"' in h
          assert 'intelligence-ribbon' in h and '.intelligence-ribbon' in c
          assert 'id="stat-total"' in h and 'Top 10 prospects' in h
          assert 'opportunity.js' in h
          assert 'id="source-filter"' not in h and 'id="website-filter"' not in h
          assert 'id="age-filter"' not in h and 'id="search"' not in h
          new=Path("index.html").read_text(encoding="utf-8")
          assert 'sales.js' in new and 'legacy-radar.html' in new
          assert 'data-view="queue"' in new and 'data-view="premium"' in new
          print("Legacy CRM retained and Excel-gated October homepage verified")
          PY
      - name: Install Chromium for dashboard smoke
        run: python -m playwright install --with-deps chromium
      - name: Browser-test the top-ten dashboard
        run: python scripts/smoke_dashboard.py
      - name: Browser-test October Excel qualification dashboard
        run: python scripts/smoke_sales_dashboard.py
      - name: Browser-test Czech roofing demo mobile responsiveness
        run: python scripts/smoke_roofer_demo.py
